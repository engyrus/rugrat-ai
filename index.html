<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugrat AI: The world's most toddler AI in the world</title>
  <meta name="description" content="Rugrat AI is a cutting-edge artificial intelligence trained on three years of human experience. Ask it anything.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
      --radius-xl: 1rem; --radius-full: 9999px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    :root, [data-theme="dark"] {
      --color-bg: #0d0d0d;
      --color-surface: #171717;
      --color-surface-2: #1e1e1e;
      --color-surface-offset: #252525;
      --color-border: #2a2a2a;
      --color-text: #ececec;
      --color-text-muted: #8a8a8a;
      --color-text-faint: #555;
      --color-primary: #10a37f;
      --color-primary-hover: #0d8a6c;
      --color-primary-glow: rgba(16,163,127,0.15);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --color-bg: #ffffff;
      --color-surface: #f7f7f8;
      --color-surface-2: #efefef;
      --color-surface-offset: #e8e8e8;
      --color-border: #e0e0e0;
      --color-text: #202020;
      --color-text-muted: #666;
      --color-text-faint: #aaa;
      --color-primary: #10a37f;
      --color-primary-hover: #0d8a6c;
      --color-primary-glow: rgba(16,163,127,0.1);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-6);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: var(--space-2);
      text-decoration: none; color: var(--color-text);
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-wordmark { font-size: var(--text-sm); font-weight: 600; letter-spacing: -0.01em; }
    .logo-tld { color: var(--color-primary); }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); }
    .theme-toggle {
      background: none; border: none; cursor: pointer;
      color: var(--color-text-muted); padding: var(--space-2);
      border-radius: var(--radius-md);
      transition: color var(--transition), background var(--transition);
      display: flex; align-items: center;
    }
    .theme-toggle:hover { color: var(--color-text); background: var(--color-surface-offset); }
    .badge {
      font-size: var(--text-xs); font-weight: 500;
      background: var(--color-surface-offset);
      color: var(--color-text-muted);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
    }

    /* Layout */
    .main { flex: 1; display: flex; flex-direction: column; max-width: 760px; width: 100%; margin: 0 auto; padding: 0 var(--space-4); }

    /* Hero */
    .hero {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: var(--space-16) 0 var(--space-8);
      gap: var(--space-4);
    }
    .hero-logo {
      width: 64px; height: 64px;
      background: var(--color-primary);
      border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--space-2);
      box-shadow: 0 0 40px var(--color-primary-glow);
    }
    .hero h1 { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .hero-sub { color: var(--color-text-muted); font-size: var(--text-sm); max-width: 42ch; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; margin-top: var(--space-2); }
    .suggestion-btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      color: var(--color-text-muted);
      font-size: var(--text-xs); font-family: var(--font-body);
      padding: var(--space-2) var(--space-3);
      cursor: pointer;
      transition: all var(--transition);
      text-align: left; line-height: 1.4;
    }
    .suggestion-btn:hover { background: var(--color-surface-2); color: var(--color-text); border-color: var(--color-text-faint); }

    /* Chat */
    .chat-area {
      display: none; flex: 1; overflow-y: auto;
      padding: var(--space-6) 0;
      gap: var(--space-6); flex-direction: column;
    }
    .chat-area.visible { display: flex; }
    .message { display: flex; gap: var(--space-3); align-items: flex-start; }
    .avatar {
      width: 28px; height: 28px; border-radius: var(--radius-md);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; margin-top: 2px;
    }
    .avatar-user { background: var(--color-surface-offset); color: var(--color-text-muted); }
    .avatar-bot { background: var(--color-primary); }
    .message-content { flex: 1; }
    .message-text { font-size: var(--text-base); line-height: 1.65; color: var(--color-text); }
    .message-text.bot-response {
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    /* Thinking */
    .thinking { display: flex; align-items: center; gap: var(--space-3); }
    .thinking-dots { display: flex; gap: 5px; align-items: center; }
    .thinking-dots span {
      width: 7px; height: 7px;
      background: var(--color-text-muted);
      border-radius: var(--radius-full);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .thinking-label { font-size: var(--text-xs); color: var(--color-text-faint); font-style: italic; }

    /* Input */
    .input-area {
      padding: var(--space-4) 0 var(--space-6);
      position: sticky; bottom: 0;
      background: linear-gradient(to top, var(--color-bg) 80%, transparent);
    }
    .input-wrapper {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      display: flex; align-items: flex-end;
      gap: var(--space-2); padding: var(--space-3) var(--space-4);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input-wrapper:focus-within {
      border-color: var(--color-text-faint);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }
    #prompt-input {
      flex: 1; background: none; border: none; outline: none;
      font-family: var(--font-body); font-size: var(--text-sm);
      color: var(--color-text); resize: none;
      min-height: 24px; max-height: 160px; line-height: 1.6;
    }
    #prompt-input::placeholder { color: var(--color-text-faint); }
    .send-btn {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      background: var(--color-primary); border: none;
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: background var(--transition), transform var(--transition);
    }
    .send-btn:hover { background: var(--color-primary-hover); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--color-surface-offset); color: var(--color-text-faint); cursor: not-allowed; }
    .input-footnote { text-align: center; font-size: var(--text-xs); color: var(--color-text-faint); margin-top: var(--space-2); }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-4) var(--space-6);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: var(--space-2);
    }
    .footer-left { font-size: var(--text-xs); color: var(--color-text-faint); }
    .footer-links { display: flex; gap: var(--space-4); }
    .footer-links a { font-size: var(--text-xs); color: var(--color-text-faint); text-decoration: none; transition: color var(--transition); }
    .footer-links a:hover { color: var(--color-text-muted); }

    @media (max-width: 600px) {
      .header { padding: var(--space-3) var(--space-4); }
      .hero { padding: var(--space-10) 0 var(--space-6); }
      .site-footer { flex-direction: column; align-items: flex-start; }
      .badge { display: none; }
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }
  </style>
</head>
<body>

<header class="header">
  <a class="logo" href="#">
    <div class="logo-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">

<main class="main" id="main">

<script>
  // Theme toggle
  (function(){
    const t = document.querySelector("[data-theme-toggle]");
    const r = document.documentElement;
    let d = "dark";
    r.setAttribute("data-theme", d);
    if (!t) return;
    t.addEventListener("click", () => {
      d = d === "dark" ? "light" : "dark";
      r.setAttribute("data-theme", d);
      t.setAttribute("aria-label", "Switch to " + (d === "dark" ? "light" : "dark") + " mode");
      t.innerHTML = d === "dark"
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    });
  })();

  // Fallback random responses
  // "i love you" appears with ~5% chance via rare roll
  const responses = [
    "NO!",
    "DON'T WANNA!",
    "NO NO NO NO NO!",
    "YOU'RE NOT MY REAL DAD!",
    "I'M TELLING MOM!",
    "MINE!",
    "NUHHHH UHH!",
    "MAKE ME!",
    "I HATE THIS!",
    "WAAAAAAAAAAH!",
    "STOP IT STOP IT STOP IT!",
    "I DON'T CARE!",
    "THAT'S DUMB!",
    "WHY???",
    "I ALREADY KNOW EVERYTHING!",
    "YAYYYYYY!",
    "WHEEEEE!",
    "ARE WE THERE YET?",
    "I WANT THAT ONE!",
    "IT'S NOT FAIR!",
    "HE STARTED IT!",
    "I DIDN'T DO IT!",
    "BUT WHYYYYYYYY!",
    "I'M BORED!",
    "CAN WE GO HOME?",
    "I WANT SNACKS!",
    "YOU'RE MEAN!"
  ];

  // Rare responses with their relative weight (out of 100)
  const rareResponses = [
    { text: "i love you", weight: 5 }
  ];

  // Keyword-triggered responses (checked before random pool)
  const keywordRules = [
    { words: ["old", "age", "how old"],              replies: ["THIS MANY!"] },
    { words: ["why"],                                 replies: ["BECAUSE!", "JUST BECAUSE!", "BECAUSE I SAID SO!", "JUST BECAUSE!"] },
    { words: ["please", "pretty please"],             replies: ["NO! …STILL NO!", "NOPE! NOT EVEN FOR PLEASE!"] },
    { words: ["eat", "food", "hungry", "snack"],      replies: ["I DON'T LIKE IT!", "EWW!", "IT'S YUCKY!", "I WANT SNACKS!"] },
    { words: ["sleep", "nap", "tired", "bed"],        replies: ["I'M NOT TIRED!", "I'M NOT EVEN A LITTLE TIRED!", "YOU'RE TIRED!"] },
    { words: ["share"],                               replies: ["MINE!", "YOU CAN'T HAVE IT!", "NO!"] },
    { words: ["stop", "quit"],                        replies: ["YOU STOP!", "NO, YOU STOP!"] },
    { words: ["help"],                                replies: ["I DO IT MYSELF!", "I CAN DO IT!"] },
    { words: ["smart", "intelligent", "genius"],      replies: ["I KNOW, RIGHT?!", "I'M THE SMARTEST!"] },
    { words: ["sorry", "apologize"],                  replies: ["YOU SHOULD BE!", "SAY IT LIKE YOU MEAN IT!"] },
    { words: ["potty", "bathroom", "toilet", "pee"],  replies: ["I DON'T HAFTA GO!", "I ALREADY WENT!"] },
    { words: ["where", "how far", "how long"],        replies: ["ARE WE THERE YET?", "GOTTA PEE"] },
    { words: ["fair", "unfair", "not fair"],          replies: ["IT'S NOT FAIR!", "THAT IS SO NOT FAIR!"] },
    { words: ["wrong", "mistake", "error", "fault"],  replies: ["I DIDN'T DO IT!", "IT WASN'T ME!"] },
    { words: ["wait", "later", "minute"],             replies: ["I DON'T WANNA WAIT!", "BUT I WANT IT NOOOOOW!"] },
    { words: ["buy", "money", "cost", "price"],       replies: ["I WANT THAT ONE!", "CAN WE GET IT? CAN WE? CAN WE?"] },
    { words: ["who", "was it"],                       replies: ["NOT ME!", "WASN'T ME!"] },
    { words: ["how", "explain", "what does"],         replies: ["I DUNNO!"] },
    { words: ["did anyone", "has anyone", "anyone"],  replies: ["NOBODY!", "NOT ME!"] },
    { words: ["really", "are you sure", "seriously"], replies: ["OH YEAH!", "UH HUH!"] },
    { words: ["bored", "boring", "nothing"],          replies: ["I'M BORED!", "THERE'S NOTHING TO DOOOOO!"] },
  ];

  let lastIdx = -1;

  function getResponse(promptText) {
    const lower = promptText.toLowerCase();

    // Check keyword rules first
    for (const rule of keywordRules) {
      if (rule.words.some(w => lower.includes(w))) {
        const idx = Math.floor(Math.random() * rule.replies.length);
        return rule.replies[idx];
      }
    }

    // Roll for rare response first (5% chance)
    if (Math.random() < 0.05) {
      return rareResponses[Math.floor(Math.random() * rareResponses.length)].text;
    }

    // Fall back to random pool (no repeat)
    let idx;
    do { idx = Math.floor(Math.random() * responses.length); } while (idx === lastIdx);
    lastIdx = idx;
    return responses[idx];
  }

  // Shorter = longer delay (inverse, capped at ~4s)
  function thinkingDelay(response) {
    const len = response.length;
    if (len <= 4)  return 3500 + Math.random() * 800;
    if (len <= 8)  return 2800 + Math.random() * 700;
    if (len <= 15) return 2000 + Math.random() * 600;
    return 1400 + Math.random() * 500;
  }

  const chatArea = document.getElementById("chat-area");
  const hero     = document.getElementById("hero");
  const input    = document.getElementById("prompt-input");
  const sendBtn  = document.getElementById("send-btn");
  let   busy     = false;

  function showChat() {
    hero.style.display = "none";
    chatArea.classList.add("visible");
  }

  function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function appendUser(text) {
    const el = document.createElement("div");
    el.className = "message";
    el.innerHTML = `
      <div class="avatar avatar-user" aria-hidden="true">YOU</div>
      <div class="message-content">
        <div class="message-text">${esc(text)}</div>
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendThinking() {
    const el = document.createElement("div");
    el.className = "message";
    el.id = "thinking-msg";
    el.innerHTML = `
      <div class="avatar avatar-bot" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="10" r="1.8" fill="white"/>
          <circle cx="15" cy="10" r="1.8" fill="white"/>
          <path d="M8 16 Q12 13 16 16" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="message-content">
        <div class="thinking" aria-label="Rugrat AI is thinking">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          <span class="thinking-label">processing…</span>
        </div>
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function resolveThinking(text) {
    const el = document.getElementById("thinking-msg");
    if (el) {
      el.querySelector(".message-content").innerHTML =
        `<div class="message-text bot-response">${esc(text)}</div>`;
      el.id = "";
    }
    scrollBottom();
  }

  function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";

    showChat();
    appendUser(text);

    const response = getResponse(text);
    const delay    = thinkingDelay(response);

    appendThinking();

    setTimeout(() => {
      resolveThinking(response);
      busy = false;
      sendBtn.disabled = input.value.trim() === "";
      input.focus();
    }, delay);
  }

  sendBtn.addEventListener("click", submit);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });

  input.addEventListener("input", () => {
    sendBtn.disabled = input.value.trim() === "" || busy;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  function fillPrompt(btn) {
    input.value = btn.textContent;
    input.dispatchEvent(new Event("input"));
    input.focus();
  }
</script>
</body>
</html>
